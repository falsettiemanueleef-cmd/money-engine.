name: NEXA Rental QA
on:
  push:
    branches:
      - nexa-rental-foundation
    paths:
      - "nexa-rental/**"
      - ".github/workflows/nexa-rental-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run NEXA Rental static QA
        run: node nexa-rental/qa-check.mjs
