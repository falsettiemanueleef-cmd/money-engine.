name: Weekly affiliate opportunity scan

on:
  schedule:
    # 15:00 UTC Monday = 16:00 Italy in winter / 17:00 in summer.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-affiliate-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public research leads
        run: python scripts/weekly_affiliate_scan.py
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update weekly affiliate research report"
            git push
          fi
